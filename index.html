<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>승강기 서비스 영업현장 맵핑</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Malgun Gothic", sans-serif; }
  #map { width: 100%; height: 100%; }

  .overlay-row {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    display: flex; gap: 10px; align-items: flex-start;
  }

  .panel {
    background: rgba(255,255,255,0.97); border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25); font-size: 13px; color: #222;
  }

  #search-panel { width: 300px; padding: 12px; }
  #search-panel .search-row { display: flex; gap: 6px; }
  #search-panel input[type="text"] {
    flex: 1; padding: 7px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px;
  }
  #search-panel button {
    padding: 7px 12px; border: none; border-radius: 5px; background: #FEE500; cursor: pointer; font-weight: bold;
  }
  #search-status { margin-top: 6px; font-size: 12px; color: #666; min-height: 16px; }

  .filter-group { margin-top: 12px; }
  .filter-group h4 { margin: 0 0 6px 0; font-size: 12px; color: #555; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 12px; border: 1px solid #ddd;
    cursor: pointer; user-select: none; font-size: 12px; background: #f7f7f7;
  }
  .chip.active { background: #333; color: #fff; border-color: #333; }
  .chip input { display: none; }

  #dashboard { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
  #dashboard h4 { margin: 0 0 8px 0; font-size: 12px; color: #555; }
  #dashboard table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #dashboard td { padding: 3px 0; }
  #dashboard td.count { text-align: right; font-weight: bold; }
  #dashboard tr.total td { border-top: 1px solid #ddd; padding-top: 5px; font-weight: bold; }

  .info-window {
    position: relative;
    padding: 10px 28px 10px 12px; font-size: 12px; line-height: 1.6;
    min-width: 200px; max-width: 260px; width: max-content;
    background: #fff; border: 1px solid #ccc; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
  }
  .info-window * { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
  .info-window b { font-size: 13px; }
  .info-window .close-btn {
    position: absolute; top: 4px; right: 6px; cursor: pointer;
    color: #999; font-size: 14px; line-height: 1; padding: 4px;
    user-select: none;
  }
  .info-window .close-btn:hover { color: #333; }

  #legend { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
  #legend .legend-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; margin-bottom: 3px; }
  #legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

<div class="overlay-row">
  <div id="search-panel" class="panel">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="승강기번호 / 현장명 / 프로젝트번호" />
      <button id="search-btn">검색</button>
    </div>
    <div id="search-status">데이터 로딩 중...</div>

    <div class="filter-group">
      <h4>제조업체 표시</h4>
      <div class="chip-row" id="manufacturer-filters"></div>
    </div>
    <div class="filter-group">
      <h4>유지보수업체 표시</h4>
      <div class="chip-row" id="mntcompany-filters"></div>
    </div>

    <div id="dashboard">
      <h4>유지보수업체 현황</h4>
      <table id="dashboard-table"></table>
      <div id="legend"></div>
    </div>
  </div>
</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=05f3e6e2292430d167a08d5521dc5509&libraries=clusterer&autoload=false"></script>
<script>
kakao.maps.load(function () {
  var COMPANY_GROUPS = ["오티스", "현대", "티케이", "미쓰비시", "기타"];

  function classifyCompany(name) {
    if (!name) return "기타";
    var n = String(name).toUpperCase();
    if (n.indexOf("오티스") !== -1 || n.indexOf("OTIS") !== -1 || n.indexOf("엘지산전") !== -1 || n.indexOf("LG산전") !== -1) return "오티스";
    if (n.indexOf("현대") !== -1) return "현대";
    if (n.indexOf("티센") !== -1 || n.indexOf("티케이") !== -1 || n.indexOf("THYSSEN") !== -1 || n.indexOf("TK") !== -1) return "티케이";
    if (n.indexOf("미쓰비시") !== -1 || n.indexOf("MITSUBISHI") !== -1) return "미쓰비시";
    return "기타";
  }

  var MAJOR_COMPANY_DISPLAY_NAME = { "오티스": "오티스", "현대": "현대", "티케이": "티케이(티센)", "미쓰비시": "미쓰비시" };

  function displayCompanyName(name) {
    if (!name) return "-";
    var bucket = classifyCompany(name);
    if (bucket === "기타") return name; // 중소업체는 풀네임 그대로
    return MAJOR_COMPANY_DISPLAY_NAME[bucket];
  }

  var COMPANY_COLORS = { "현대": "#2E7D32", "오티스": "#1565C0", "티케이": "#6A1B9A", "미쓰비시": "#C62828", "기타": "#000000" };

  function buildingSvgDataUrl(color) {
    // 2층짜리 작은 건물 (창문 2줄 = 2개 층, 문 1개)
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="26" viewBox="0 0 20 26">' +
      '<ellipse cx="10" cy="24" rx="6" ry="1.8" fill="#000000" opacity="0.15"/>' +
      '<rect x="4" y="4" width="12" height="18" rx="2" fill="' + color + '" stroke="#ffffff" stroke-width="1.2"/>' +
      '<rect x="6.3" y="6.5" width="2.8" height="2.8" fill="#ffffff"/>' +
      '<rect x="10.9" y="6.5" width="2.8" height="2.8" fill="#ffffff"/>' +
      '<rect x="6.3" y="11.5" width="2.8" height="2.8" fill="#ffffff"/>' +
      '<rect x="10.9" y="11.5" width="2.8" height="2.8" fill="#ffffff"/>' +
      '<rect x="8.2" y="17" width="3.6" height="5" fill="#ffffff"/>' +
      '</svg>';
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  }

  var markerImageCache = {};
  function getMarkerImage(group) {
    if (!markerImageCache[group]) {
      var color = COMPANY_COLORS[group] || COMPANY_COLORS["기타"];
      markerImageCache[group] = new kakao.maps.MarkerImage(
        buildingSvgDataUrl(color),
        new kakao.maps.Size(20, 26),
        { offset: new kakao.maps.Point(10, 24) }
      );
    }
    return markerImageCache[group];
  }

  function renderLegend() {
    var legend = document.getElementById("legend");
    legend.innerHTML = "";
    COMPANY_GROUPS.forEach(function (g) {
      var row = document.createElement("div");
      row.className = "legend-row";
      var swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = COMPANY_COLORS[g];
      row.appendChild(swatch);
      row.appendChild(document.createTextNode(g));
      legend.appendChild(row);
    });
  }

  var map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(36.35, 127.8),
    level: 13,
  });
  window.__debugMap = map; // 콘솔에서 __debugMap.getLevel() 로 현재 레벨 확인용

  // 카카오맵이 기본 제공하는 지도/스카이뷰 전환 버튼 (커스텀 스타일링은 API에서 지원 안 함)
  map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);

  // 전국 시/군/구 경계선 - 카카오맵 타일엔 없는 기능이라
  // 공공데이터(KOSTAT 2013 행정구역 경계) 좌표를 폴리곤으로 직접 그림
  // 축소(레벨 숫자 커짐)할수록 선이 빽빽하게 겹쳐 보이므로, 확대 상태에서만 굵게 표시
  var districtPolygons = [];
  var DISTRICT_ZOOM_THRESHOLD = 5; // 이 레벨보다 축소되면(숫자가 커지면) 얇게

  function districtStrokeWeight(level) {
    return level <= DISTRICT_ZOOM_THRESHOLD ? 3 : 1;
  }

  function updateDistrictStrokeWeights() {
    var weight = districtStrokeWeight(map.getLevel());
    districtPolygons.forEach(function (polygon) {
      polygon.setOptions({ strokeWeight: weight });
    });
  }

  function renderDistrictBoundaries(url, strokeColor) {
    fetch(url)
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (geojson) {
        if (!geojson) return;
        geojson.features.forEach(function (feature) {
          var polygons = feature.geometry.type === "MultiPolygon"
            ? feature.geometry.coordinates
            : [feature.geometry.coordinates];
          polygons.forEach(function (rings) {
            var path = rings[0].map(function (c) { return new kakao.maps.LatLng(c[1], c[0]); });
            var polygon = new kakao.maps.Polygon({
              map: map,
              path: path,
              strokeWeight: districtStrokeWeight(map.getLevel()),
              strokeColor: strokeColor,
              strokeOpacity: 0.85,
              fillOpacity: 0,
            });
            districtPolygons.push(polygon);
          });
        });
      })
      .catch(function () { /* 경계 데이터 없으면 그냥 무시 */ });
  }
  renderDistrictBoundaries("./data/sigungu_boundary.json", "#2563EB");
  kakao.maps.event.addListener(map, "zoom_changed", updateDistrictStrokeWeights);

  // 실측 결과 카카오맵 축척눈금이 "2km"로 보이는 지점이 레벨 8 -> 레벨 8까지는 개별 마커, 레벨 9부터 클러스터링
  var clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 9 });
  // 카카오 InfoWindow는 내용 길이에 따라 박스 높이를 잘못 계산해 잘리는 경우가 있어
  // 대신 CustomOverlay + 직접 스타일링한 div로 내용 길이에 맞춰 자동으로 커지게 처리
  var overlay = new kakao.maps.CustomOverlay({ yAnchor: 1.15, zIndex: 2 });

  kakao.maps.event.addListener(map, "click", function () {
    closeInfoWindow();
  });

  var allData = [];
  var activeManufacturer = {};
  var activeMntCompany = {};
  COMPANY_GROUPS.forEach(function (g) {
    activeManufacturer[g] = true;
    activeMntCompany[g] = true;
  });

  function buildFilterChips(containerId, activeMap) {
    var container = document.getElementById(containerId);
    COMPANY_GROUPS.forEach(function (group) {
      var label = document.createElement("label");
      label.className = "chip active";
      var input = document.createElement("input");
      input.type = "checkbox";
      input.checked = true;
      input.addEventListener("change", function () {
        activeMap[group] = input.checked;
        label.classList.toggle("active", input.checked);
        refresh();
      });
      label.appendChild(input);
      label.appendChild(document.createTextNode(group));
      container.appendChild(label);
    });
  }
  buildFilterChips("manufacturer-filters", activeManufacturer);
  buildFilterChips("mntcompany-filters", activeMntCompany);
  renderLegend();

  function getFiltered() {
    return allData.filter(function (item) {
      return activeManufacturer[classifyCompany(item.manufacturer)] &&
             activeMntCompany[classifyCompany(item.mntCompany)];
    });
  }

  var openMarker = null;

  function renderMarkers(data) {
    clusterer.clear();
    var markers = data.map(function (item) {
      var position = new kakao.maps.LatLng(item.lat, item.lng);
      var marker = new kakao.maps.Marker({
        position: position,
        image: getMarkerImage(classifyCompany(item.mntCompany)),
      });
      marker.__item = item;

      kakao.maps.event.addListener(marker, "click", function () {
        if (openMarker === marker) {
          closeInfoWindow();
        } else {
          openInfoWindow(marker, item);
        }
      });

      return marker;
    });
    clusterer.addMarkers(markers);
    return markers;
  }

  function openInfoWindow(marker, item) {
    var content = document.createElement("div");
    content.className = "info-window";
    content.innerHTML =
      "<span class=\"close-btn\">&times;</span>" +
      "<b>" + (item.name || "이름없음") + "</b><br/>" +
      (item.address || "") + "<br/>" +
      "제조: " + displayCompanyName(item.manufacturer) + " / 보수: " + displayCompanyName(item.mntCompany) + "<br/>" +
      "대수: " + (item.unitCount ? item.unitCount + "대" : "-") + "<br/>" +
      "상태: " + (item.status || "-") + " / 종류: " + (item.kind || "-") + "<br/>" +
      "최초설치일: " + (item.firstInstallDate || "-") + "<br/>" +
      "설치일: " + (item.installDate || "-") + "<br/>" +
      "승강기번호: " + item.id +
      (item.projectNo ? "<br/>프로젝트번호: " + item.projectNo : "");
    content.querySelector(".close-btn").addEventListener("click", closeInfoWindow);
    // 정보창 안에서의 클릭/드래그/더블클릭이 지도(드래그 선택, 더블클릭 확대 등)로
    // 전파되지 않도록 막아서, 정보창을 지도와 별도의 영역으로 취급되게 함
    ["mousedown", "touchstart", "click", "dblclick"].forEach(function (evt) {
      content.addEventListener(evt, function (e) { e.stopPropagation(); });
    });

    overlay.setContent(content);
    overlay.setPosition(marker.getPosition());
    overlay.setMap(map);
    openMarker = marker;
  }

  function closeInfoWindow() {
    overlay.setMap(null);
    openMarker = null;
  }

  function updateDashboard(data) {
    var counts = {};
    COMPANY_GROUPS.forEach(function (g) { counts[g] = 0; });
    data.forEach(function (item) {
      counts[classifyCompany(item.mntCompany)]++;
    });
    var table = document.getElementById("dashboard-table");
    table.innerHTML = "";
    COMPANY_GROUPS.forEach(function (g) {
      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + g + "</td><td class='count'>" + counts[g].toLocaleString() + "</td>";
      table.appendChild(tr);
    });
    var totalTr = document.createElement("tr");
    totalTr.className = "total";
    totalTr.innerHTML = "<td>합계</td><td class='count'>" + data.length.toLocaleString() + "</td>";
    table.appendChild(totalTr);
  }

  var currentMarkers = [];

  function refresh() {
    closeInfoWindow();
    var filtered = getFiltered();
    currentMarkers = renderMarkers(filtered);
    updateDashboard(filtered);
    document.getElementById("search-status").textContent = "표시된 승강기: " + filtered.length.toLocaleString() + "건";
  }

  function doSearch() {
    var q = document.getElementById("search-input").value.trim();
    var statusEl = document.getElementById("search-status");
    if (!q) { refresh(); return; }

    var pool = getFiltered();
    var digits = q.replace(/[^0-9]/g, "");
    var match = null;

    if (digits.length === 7) {
      match = pool.filter(function (item) { return String(item.id) === digits; });
    } else if (digits.length === 6) {
      match = pool.filter(function (item) { return String(item.projectNo) === digits; });
    }
    if (!match || match.length === 0) {
      var qLower = q.toLowerCase();
      match = pool.filter(function (item) { return item.name && item.name.toLowerCase().indexOf(qLower) !== -1; });
    }

    if (match.length === 0) {
      statusEl.textContent = "검색 결과 없음: " + q;
      return;
    }

    statusEl.textContent = "검색 결과 " + match.length.toLocaleString() + "건 (첫 번째로 이동)";
    var target = match[0];
    var pos = new kakao.maps.LatLng(target.lat, target.lng);
    map.setLevel(3);
    map.panTo(pos);

    var marker = currentMarkers.filter(function (m) { return m.__item.id === target.id; })[0];
    if (marker) openInfoWindow(marker, target);
  }

  document.getElementById("search-btn").addEventListener("click", doSearch);
  document.getElementById("search-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") doSearch();
  });

  function loadData(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("not found");
      return res.json();
    });
  }

  // 전국 데이터를 지역(시/도)별 파일로 나눠뒀기 때문에, 지금 지도 화면에 걸치는
  // 지역 파일만 불러온다 (regions_manifest.json 에 지역별 위경도 범위가 있음).
  var regionsManifest = null;
  var loadedRegions = {};

  function boundsOverlap(info, sw, ne) {
    return !(info.maxLat < sw.getLat() || info.minLat > ne.getLat() ||
             info.maxLng < sw.getLng() || info.minLng > ne.getLng());
  }

  function loadRegionsInView() {
    if (!regionsManifest) return;
    var bounds = map.getBounds();
    var sw = bounds.getSouthWest();
    var ne = bounds.getNorthEast();
    var toLoad = [];
    Object.keys(regionsManifest).forEach(function (region) {
      if (loadedRegions[region]) return;
      var info = regionsManifest[region];
      if (boundsOverlap(info, sw, ne)) {
        loadedRegions[region] = true;
        toLoad.push(region);
      }
    });
    if (toLoad.length === 0) return;

    document.getElementById("search-status").textContent = "지역 데이터 불러오는 중... (" + toLoad.join(", ") + ")";
    Promise.all(
      toLoad.map(function (region) {
        return loadData("./" + regionsManifest[region].file).catch(function () { return []; });
      })
    ).then(function (results) {
      results.forEach(function (items) { allData = allData.concat(items); });
      refresh();
    });
  }

  loadData("./data/regions_manifest.json")
    .then(function (manifest) {
      regionsManifest = manifest;
      loadRegionsInView();
      kakao.maps.event.addListener(map, "idle", loadRegionsInView);
    })
    .catch(function () {
      document.getElementById("search-status").textContent = "실데이터 없음 - 샘플 데이터로 표시";
      return loadData("./data/elevators.sample.json").then(function (data) {
        allData = data;
        refresh();
      });
    })
    .catch(function (err) {
      document.getElementById("search-status").textContent = "데이터 로딩 실패: " + err.message;
    });
});
</script>
</body>
</html>
