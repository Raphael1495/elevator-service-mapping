<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>승강기 서비스 영업현장 맵핑</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Malgun Gothic", sans-serif; }
  #map { width: 100%; height: 100%; }
  #status-bar {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(255,255,255,0.95); padding: 8px 14px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 13px; color: #333;
  }
  .info-window { padding: 8px 10px; font-size: 12px; line-height: 1.5; min-width: 180px; }
  .info-window b { font-size: 13px; }
</style>
</head>
<body>
<div id="status-bar">데이터 로딩 중...</div>
<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=05f3e6e2292430d167a08d5521dc5509&libraries=clusterer&autoload=false"></script>
<script>
kakao.maps.load(function () {
  var mapContainer = document.getElementById("map");
  var map = new kakao.maps.Map(mapContainer, {
    center: new kakao.maps.LatLng(36.35, 127.8), // 대한민국 중앙 부근
    level: 13,
  });

  var clusterer = new kakao.maps.MarkerClusterer({
    map: map,
    averageCenter: true,
    minLevel: 6,
  });

  var infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });
  var statusBar = document.getElementById("status-bar");

  function renderMarkers(data) {
    var markers = data.map(function (item) {
      var position = new kakao.maps.LatLng(item.lat, item.lng);
      var marker = new kakao.maps.Marker({ position: position });

      kakao.maps.event.addListener(marker, "click", function () {
        infoWindow.setContent(
          '<div class="info-window">' +
            "<b>" + (item.name || "이름없음") + "</b><br/>" +
            (item.address || "") + "<br/>" +
            "관리업체: " + (item.company || "-") + "<br/>" +
            "상태: " + (item.status || "-") + " / 종류: " + (item.kind || "-") + "<br/>" +
            "설치일: " + (item.installDate || "-") +
          "</div>"
        );
        infoWindow.open(map, marker);
      });

      return marker;
    });

    clusterer.addMarkers(markers);
    statusBar.textContent = "표시된 승강기: " + data.length.toLocaleString() + "건";
  }

  function loadData(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("not found");
      return res.json();
    });
  }

  loadData("./data/elevators.json")
    .catch(function () {
      statusBar.textContent = "실데이터 없음 - 샘플 데이터로 표시";
      return loadData("./data/elevators.sample.json");
    })
    .then(renderMarkers)
    .catch(function (err) {
      statusBar.textContent = "데이터 로딩 실패: " + err.message;
    });
});
</script>
</body>
</html>
